<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ブラウザだけで使えるシンプルなTODOリスト">
  <title>Daily Tasks | TODOリスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-app" aria-labelledby="page-title">
      <header class="app-header">
        <div>
          <p class="eyebrow">PERSONAL PLANNER</p>
          <h1 id="page-title">Daily tasks<span class="title-dot">.</span></h1>
          <p class="subtitle">今日やることを、ひとつずつ。</p>
        </div>
        <div class="date-badge" id="today-date" aria-label="今日の日付"></div>
      </header>

      <form class="task-form" id="task-form">
        <label class="sr-only" for="task-input">新しいTODO</label>
        <input id="task-input" type="text" placeholder="新しいタスクを入力" maxlength="100" autocomplete="off" required>
        <label class="sr-only" for="task-date">TODOの日付</label>
        <input id="task-date" type="date" aria-label="TODOの日付" required>
        <button class="add-button" type="submit" aria-label="TODOを追加"><span>＋</span> 追加</button>
      </form>

      <div class="toolbar">
        <div class="task-count"><strong id="remaining-count">0</strong> 件の未完了</div>
        <div class="filters" role="group" aria-label="TODOの表示切り替え">
          <button class="filter-button is-active" type="button" data-filter="all">すべて</button>
          <button class="filter-button" type="button" data-filter="active">未完了</button>
          <button class="filter-button" type="button" data-filter="completed">完了</button>
        </div>
      </div>

      <ul class="task-list" id="task-list" aria-live="polite"></ul>
      <div class="empty-state" id="empty-state">
        <div class="empty-icon" aria-hidden="true">✓</div>
        <h2 id="empty-title">タスクはまだありません</h2>
        <p id="empty-message">上の入力欄から、今日やることを追加しましょう。</p>
      </div>

      <footer class="app-footer">
        <span class="save-status"><span class="status-dot"></span>ブラウザに自動保存</span>
        <button class="clear-button" id="clear-completed" type="button">完了済みを削除</button>
      </footer>
    </section>
    <p class="footer-note">DB不要 · あなたのブラウザだけで動作します</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
